<!DOCTYPE html>
<html>
<head>
    <title>API Product Search</title>
</head>
<body>
    <h1>Product Search Application</h1>
    <!-- Search Section -->
    <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
    >
    <button id="clearButton">Clear</button>
    <!-- Loading Indicator -->
    <p id="loading"></p>
    <!-- Error Message -->
    <p id="error"></p>
    <!-- Search Results -->
    <h2>Products</h2>
    <div id="productContainer"></div>
    <script src="./script.js"></script>
</body>
</html>
