<!DOCTYPE html>
<html>
<head>
    <title>Debounce and Throttle</title>
</head>
<body>
    <h2>JavaScript Debounce and Throttle</h2>
    <!-- Debounce Example -->
    <h3>Debounce - Search Products</h3>
    <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
    >
    <div id="searchOutput"></div>
    <hr>
    <!-- Throttle Example -->
    <h3>Throttle - Button Click</h3>
    <button id="clickButton">Click Me</button>
    <div id="clickOutput"></div>
    <hr>
    <!-- Scroll Throttle -->
    <h3>Throttle - Scroll Event</h3>
    <div id="scrollOutput"></div>
    <div style="height: 1000px;">
        <h3>Scroll Down to Test Throttle</h3>
    </div>
    <script src="./task9.js"></script>
</body>
</html>
