<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Employee Management System</h1>
        <p>Manage employee records using JavaScript OOP</p>
        <!-- Employee Form -->
        <section class="form-section">
            <h2 id="formTitle">Add Employee</h2>
            <form id="employeeForm">
                <input type="text" id="name"
                    placeholder="Employee Name" required>
                <input type="email" id="email"
                    placeholder="Email Address" required>
                <input type="number" id="age"
                    placeholder="Age" min="18" required>
                <select id="department" required>
                    <option value="">Select Department</option>
                    <option value="Frontend">Frontend</option>
                    <option value="Backend">Backend</option>
                    <option value="Testing">Testing</option>
                    <option value="HR">HR</option>
                    <option value="Management">Management</option>
                </select>
                <select id="role" required>
                    <option value="">Select Role</option>
                    <option value="Employee">Employee</option>
                    <option value="Developer">Developer</option>
                    <option value="Manager">Manager</option>
                </select>
                <input type="number" id="salary"
                    placeholder="Monthly Salary" min="10000" required>
                <div id="extraField"></div>
                <button type="submit" id="submitBtn">
                    Add Employee
                </button>
                <button type="button" id="cancelBtn" hidden>
                    Cancel Edit
                </button>
            </form>
        </section>
        <!-- Employee Statistics -->
        <section class="stats">
            <div class="stat-card">
                <h3>Total Employees</h3>
                <h2 id="totalEmployees">0</h2>
            </div>
            <div class="stat-card">
                <h3>Total Monthly Salary</h3>
                <h2 id="totalSalary">₹0</h2>
            </div>
            <div class="stat-card">
                <h3>Average Salary</h3>
                <h2 id="averageSalary">₹0</h2>
            </div>
        </section>
        <!-- Search and Filter -->
        <section class="search-section">
            <input type="text" id="search"
                placeholder="Search by name or ID">
            <select id="filterDepartment">
                <option value="">All Departments</option>
                <option value="Frontend">Frontend</option>
                <option value="Backend">Backend</option>
                <option value="Testing">Testing</option>
                <option value="HR">HR</option>
                <option value="Management">Management</option>
            </select>
        </section>
        <!-- Employee List -->
        <section class="employee-section">
            <h2>Employee List</h2>
            <div id="employeeList"></div>
        </section>
    </div>
    <script src="./script.js"></script>
</body>
</html>
