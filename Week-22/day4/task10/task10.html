<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Modules</title>
</head>
<body>

    <h1>Student Management Application</h1>

    <label for="studentName">Student Name:</label>
    <input type="text" id="studentName" placeholder="Enter student name">

    <br><br>

    <label for="studentMarks">Student Marks:</label>
    <input type="number" id="studentMarks" placeholder="Enter marks" min="0" max="100">

    <br><br>

    <button id="addBtn">Add Student</button>
    <button id="showBtn">Show Students</button>
    <button id="clearBtn">Clear Output</button>

    <h2>Student List</h2>
    <div id="output" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
</body>
</html>
