<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee CRUD Application</title>
</head>
<body>

    <h1>Employee Management Application</h1>

    <h2>Add Employee</h2>

    <form id="employeeForm">
        <label for="name">Employee Name:</label>
        <input type="text" id="name" required>

        <br><br>

        <label for="email">Employee Email:</label>
        <input type="email" id="email" required>

        <br><br>

        <label for="salary">Salary:</label>
        <input type="number" id="salary" min="1" required>

        <br><br>

        <button type="submit">POST - Add Employee</button>
    </form>

    <h2>API Operations</h2>

    <button id="getBtn">GET - Load Employees</button>
    <button id="putBtn">PUT - Replace Employee 1</button>
    <button id="patchBtn">PATCH - Update Employee 1</button>
    <button id="deleteBtn">DELETE - Employee 1</button>

    <h2>Status</h2>
    <p id="status" aria-live="polite">Click Load Employees to begin.</p>

    <h2>Employee List</h2>
    <div id="employeeList"></div>

    <script src="./task7.js"></script>
</body>
</html>
