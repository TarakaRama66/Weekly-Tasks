
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management Application</title>
</head>
<body>

    <h1>Product Management Application</h1>

    <h2>Add / Edit Product</h2>

    <form id="productForm">
        <input type="hidden" id="productId">

        <label for="title">Product Name:</label>
        <input type="text" id="title" required maxlength="100"
               placeholder="Enter product name">

        <br><br>

        <label for="price">Price:</label>
        <input type="number" id="price" min="0.01" step="0.01"
               required placeholder="Enter price">

        <br><br>

        <label for="category">Category:</label>
        <input type="text" id="category" required
               placeholder="Enter category">

        <br><br>

        <label for="description">Description:</label>
        <textarea id="description" required
                  placeholder="Enter description"></textarea>

        <br><br>

        <button type="submit" id="saveBtn">Add Product</button>
        <button type="button" id="cancelBtn" hidden>Cancel Edit</button>
    </form>

    <hr>

    <h2>Search and Filter</h2>

    <label for="searchInput">Search Products:</label>
    <input type="search" id="searchInput"
           placeholder="Search by product name">

    <label for="categoryFilter">Filter Category:</label>
    <select id="categoryFilter">
        <option value="all">All Categories</option>
    </select>

    <button type="button" id="refreshBtn">Reload from API</button>

    <h2>Products</h2>

    <p id="status" role="status" aria-live="polite">
        Loading products...
    </p>

    <div id="productList"></div>

    <h2>Product Details</h2>
    <div id="productDetails">
        Select a product to view its details.
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
