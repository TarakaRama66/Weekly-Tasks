<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management</title>
</head>
<body>
    <h1>Student Result Management Program</h1>

    <h2>Add Student Details</h2>

    <form id="studentForm">
        <label for="name">Student Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" required>
        <br><br>

        <label for="mark1">Telugu:</label>
        <input type="number" id="mark1" min="0" max="100" required>
        <br><br>

        <label for="mark2">English:</label>
        <input type="number" id="mark2" min="0" max="100" required>
        <br><br>

        <label for="mark3">Hindi:</label>
        <input type="number" id="mark3" min="0" max="100" required>
        <br><br>

        <label for="mark4">Maths:</label>
        <input type="number" id="mark4" min="0" max="100" required>
        <br><br>

        <label for="mark5">Science:</label>
        <input type="number" id="mark5" min="0" max="100" required>
        <br><br>

        <button type="submit">Add Student</button>
    </form>

    <h2>Student Results</h2>

    <button onclick="displayResults()">Refresh Results</button>
    <button onclick="clearResults()">Clear All Results</button>

    <pre id="output">No student results available.</pre>

    <script src="./index.js"></script>
</body>
</html>
