<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage Application</title>
</head>
<body>

    <h1>Employee Data Storage</h1>

    <form id="employeeForm">
        <input type="text" id="name" placeholder="Employee Name" required>
        <input type="text" id="department" placeholder="Department" required>

        <button type="submit">Save Employee</button>
    </form>

    <h2>Saved Employees</h2>
    <ul id="employeeList"></ul>

    <button id="clearBtn">Clear All Employees</button>

    <script src="./task8.js"></script>
</body>
</html>
