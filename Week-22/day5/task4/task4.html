<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
</head>
<body>
    <h2>Employee Management Application</h2>
    <h3>Add Employee</h3>
    <form id="employeeForm">
        <input type="text" id="name" placeholder="Employee Name" required>
        <br><br>
        <input type="number" id="age" placeholder="Employee Age" required>
        <br><br>
        <input type="text" id="role" placeholder="Employee Role" required>
        <br><br>
        <input type="number" id="salary" placeholder="Employee Salary" required>
        <br><br>
        <button type="submit">Add Employee</button>
    </form>
    <h3>Employee List</h3>
    <div id="employeeList"></div>
    <script src="./task4.js"></script>
</body>
</html>
