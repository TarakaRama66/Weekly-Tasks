
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Sets and Maps</title>
</head>
<body>

    <h2>Student Management Application</h2>

    <h3>Add Student</h3>

    <input type="number" id="studentId" placeholder="Student ID">
    <br><br>

    <input type="text" id="studentName" placeholder="Student Name">
    <br><br>

    <input type="text" id="course" placeholder="Course">
    <br><br>

    <button id="addBtn">Add Student</button>

    <hr>

    <h3>Search Student</h3>

    <input type="number" id="searchId" placeholder="Enter Student ID">

    <button id="searchBtn">Search</button>

    <h3>Delete Student</h3>

    <input type="number" id="deleteId" placeholder="Enter Student ID">

    <button id="deleteBtn">Delete</button>

    <hr>

    <h3>Student Information</h3>

    <div id="output"></div>

    <h3>Unique Student IDs (Set)</h3>

    <div id="setOutput"></div>

    <script src="./task7.js"></script>

</body>
</html>
