<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Management</title>
</head>
<body>
    <h2>Bank Account Management</h2>
    <h3>Create Account</h3>
    <input type="text" id="accountHolder"
        placeholder="Account Holder Name">
    <br><br>
    <input type="number" id="initialBalance"
        placeholder="Initial Balance">
    <br><br>
    <button id="createBtn">Create Account</button>
    <hr>
    <h3>Account Operations</h3>
    <input type="number" id="amount"
        placeholder="Enter Amount">
    <br><br>
    <button id="depositBtn">Deposit</button>
    <button id="withdrawBtn">Withdraw</button>
    <br><br>
    <button id="updateNameBtn">Update Account Holder</button>
    <h3>Account Details</h3>
    <div id="output">Create an account to continue.</div>
    <h3>Transaction Message</h3>
    <p id="message"></p>
    <script src="./task6.js"></script>
</body>
</html>
