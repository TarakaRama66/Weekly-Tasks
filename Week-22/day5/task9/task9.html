
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Throttling</title>
</head>
<body>

    <h2>JavaScript Throttling Application</h2>

    <h3>1. Button Click Throttling</h3>

    <button id="clickBtn">Click Me Multiple Times</button>

    <p id="clickCount">Executed Clicks: 0</p>

    <p id="clickStatus">Click the button to test throttling.</p>

    <hr>

    <h3>2. Scroll Throttling</h3>

    <p>Scroll down to test the scroll event.</p>

    <p id="scrollCount">Scroll Executions: 0</p>

    <div style="height: 1000px;">
        <h3>Scroll Area</h3>
        <p>Keep scrolling to observe throttling.</p>
    </div>

    <script src="./task9.js"></script>

</body>
</html>
