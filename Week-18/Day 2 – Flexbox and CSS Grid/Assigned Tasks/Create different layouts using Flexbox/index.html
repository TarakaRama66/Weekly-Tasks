<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layouts</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <h2>Admin Panel</h2>
            <ul>
                <li>Dashboard</li>
                <li>Users</li>
                <li>Reports</li>
                <li>Settings</li>
            </ul>
        </aside>
        <main class="content">
            <header class="header">
                <h1>Dashboard Overview</h1>
            </header>
            <section class="cards">
                <div class="card">Users</div>
                <div class="card">Revenue</div>
                <div class="card">Orders</div>
                <div class="card">Products</div>
            </section>
        </main>
    </div>
</body>
</html>
