<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Effects</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
<div class="container">
    <!-- Product Card -->
    <div class="card product-card">
        <img src="https://picsum.photos/400/250?random=1" alt="">
        <div class="content">
            <h2>Nike Air Max</h2>
            <p>Premium running shoes with modern comfort.</p>
            <button class="btn">Buy Now</button>
        </div>
    </div>
    <!-- Glass Card -->
    <div class="card glass-card">
        <h2>Frontend Developer</h2>
        <p>Create responsive and interactive web applications.</p>
    </div>
    <!-- Social Card -->
    <div class="card social-card">
        <h2>Instagram</h2>
        <p>Hover to see gradient effect.</p>
    </div>
    <!-- Image Card -->
    <div class="card image-card">
        <img src="https://picsum.photos/400/250?random=2" alt="">
    </div>
    <!-- Shine Button -->
    <div class="card button-card">
        <button class="shine-btn">Explore More</button>
    </div>
</div>
</body>
</html>
