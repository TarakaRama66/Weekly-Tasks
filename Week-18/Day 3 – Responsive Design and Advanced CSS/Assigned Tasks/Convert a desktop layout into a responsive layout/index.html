<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Product Dashboard</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
 
    <header class="header">
        <h1>Photo Library</h1>
    </header>
 
    <main class="products">
 
        <div class="card">
            <img src="https://picsum.photos/300/200?1" alt="Product">
            <h3>Laptop</h3>
            <p>High-performance laptop for developers.</p>
            <button>View Details</button>
        </div>
 
        <div class="card">
            <img src="https://picsum.photos/300/200?2" alt="Product">
            <h3>Smartphone</h3>
            <p>Latest smartphone with AI features.</p>
            <button>View Details</button>
        </div>
 
        <div class="card">
            <img src="https://picsum.photos/300/200?3" alt="Product">
            <h3>Smart Watch</h3>
            <p>Track fitness and notifications.</p>
            <button>View Details</button>
        </div>
 
        <div class="card">
            <img src="https://picsum.photos/300/200?4" alt="Product">
            <h3>Headphones</h3>
            <p>Noise cancellation technology.</p>
            <button>View Details</button>
        </div>
 
        <div class="card">
            <img src="https://picsum.photos/300/200?5" alt="Product">
            <h3>Camera</h3>
            <p>Professional photography experience.</p>
            <button>View Details</button>
        </div>
 
        <div class="card">
            <img src="https://picsum.photos/300/200?6" alt="Product">
            <h3>Gaming Console</h3>
            <p>Ultra HD gaming experience.</p>
            <button>View Details</button>
        </div>
    </main>
</body>
</html>
