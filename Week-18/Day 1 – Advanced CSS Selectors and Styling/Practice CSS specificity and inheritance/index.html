<!DOCTYPE html>
<html>
<head>
    <title>CSS Specificity and Inheritance</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
 
    <div class="container">
 
        <h1 id="main-heading" class="heading">
            Frontend Development
        </h1>
 
        <p class="text">
            Learning CSS Specificity and Inheritance.
        </p>
 
        <div class="parent">
            <h2>Inheritance Example</h2>
            <p>
                This paragraph inherits styles from parent.
            </p>
            <span>
                This span also inherits styles.
            </span>
        </div>
    </div>
</body>
</html>
