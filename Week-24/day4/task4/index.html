
<!DOCTYPE html>
<html>
<head>
    <title>Interactive UI Elements</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Interactive UI Components</h1>
    <div class="container">
        <!-- Interactive Button -->
        <section class="box">
            <h2>Interactive Button</h2>
            <button class="btn">Click Me</button>
        </section>
        <!-- Dropdown Menu -->
        <section class="box">
            <h2>Dropdown Menu</h2>
            <div class="dropdown">
                <button class="drop-btn">Select Option ▼</button>
                <div class="dropdown-content">
                    <a href="#">HTML</a>
                    <a href="#">CSS</a>
                    <a href="#">JavaScript</a>
                    <a href="#">React</a>
                </div>
            </div>
        </section>
        <!-- Tooltip -->
        <section class="box">
            <h2>Tooltip</h2>
            <div class="tooltip">
                Hover Here
                <span class="tooltip-text">Welcome to CSS!</span>
            </div>
        </section>
        <!-- Animated Card -->
        <section class="box card">
            <h2>Profile Card</h2>
            <div class="profile">
                <div class="avatar">G</div>
                <h3>Frontend Developer</h3>
                <p>Learning HTML, CSS and JavaScript.</p>
                <button class="btn">View Profile</button>
            </div>
        </section>
    </div>
</body>
</html>
