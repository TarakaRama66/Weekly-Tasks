<!DOCTYPE html>
<html>
<head>
    <title>Advanced Hover Effects</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Advanced Hover Effects</h1>
    <div class="container">
        <!-- Button Hover -->
        <div class="card">
            <h2>Button Effect</h2>
            <button class="btn">Explore More</button>
        </div>
        <!-- Image Hover -->
        <div class="card">
            <h2>Image Effect</h2>
            <div class="image-box">
                <img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=500"
                    alt="Gym workout">
            </div>
        </div>
        <!-- Card Hover -->
        <div class="card hover-card">
            <h2>Card Effect</h2>
            <p>Hover over this card to see the effect.</p>
        </div>
        <!-- Link Hover -->
        <div class="card">
            <h2>Link Effect</h2>
            <a href="#" class="link">Learn More</a>
        </div>
    </div>
</body>
</html>
