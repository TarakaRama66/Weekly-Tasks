<!DOCTYPE html>
<html>
<head>
    <title>CSS Loading Indicators</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Loading Animations</h1>
    <div class="container">
        <div class="loader-section">
            <h3>Spinner Loader</h3>
            <div class="spinner"></div>
        </div>
        <div class="loader-section">
            <h3>Dots Loader</h3>
            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <div class="loader-section">
            <h3>Progress Loader</h3>
            <div class="progress">
                <div class="progress-bar"></div>
            </div>
        </div>
        <div class="loader-section">
            <h3>Pulse Animation</h3>
            <div class="pulse"></div>
        </div>
    </div>
</body>
</html>
