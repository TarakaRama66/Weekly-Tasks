
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Advanced CSS Selectors</h1>
    </header>
    <section class="container">
        <h2>Student Details</h2>
        <div class="student-list">
            <p>Tarak - HTML</p>
            <p>Ram - CSS</p>
            <p>Tilak - JavaScript</p>
            <p>Gupta - React</p>
        </div>
        <h2>Form Details</h2>
        <form>
            <input type="text" placeholder="Enter Name" required>
            <input type="email" placeholder="Enter Email">
            <input type="password" placeholder="Enter Password">
            <button type="submit">Submit</button>
        </form>
        <h2>Technology Links</h2>
        <div class="links">
            <a href="https://example.com">Website</a>
            <a href="https://example.com">Learning</a>
        </div>
        <h2>Product Cards</h2>
        <div class="products">
            <div class="product">Laptop</div>
            <div class="product">Mobile</div>
            <div class="product">Tablet</div>
            <div class="product">Keyboard</div>
        </div>
    </section>
</body>
</html>
