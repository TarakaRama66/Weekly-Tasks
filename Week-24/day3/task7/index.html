
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions and Transforms</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>CSS Transitions and Transforms</h1>
        <p>Move your mouse over the elements to see the effects.</p>
    </header>
    <main>
        <section>
            <h2>Transition Examples</h2>
            <div class="container">
                <div class="box box1">Color Change</div>
                <div class="box box2">Scale Effect</div>
                <div class="box box3">Border Effect</div>
            </div>
        </section>
        <section>
            <h2>Transform Examples</h2>
            <div class="container">
                <div class="transform rotate">Rotate</div>
                <div class="transform scale">Scale</div>
                <div class="transform translate">Move</div>
                <div class="transform skew">Skew</div>
            </div>
        </section>
        <section>
            <h2>Interactive Button</h2>
            <button class="animated-btn">Get Started</button>
        </section>
        <section>
            <h2>Card Hover Effect</h2>
            <div class="card">
                <h3>Web Development</h3>
                <p>Learn modern HTML, CSS and JavaScript.</p>
                <button>Learn More</button>
            </div>
        </section>
    </main>
</body>
</html>
