<!DOCTYPE html>
<html>
<head>
    <title>CSS Specificity and Inheritance</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>CSS Specificity</h1>
    <div class="container">
        <h2>Selector Priority</h2>
        <p class="text" id="special">Understanding CSS Specificity</p>
        <p class="text">This is a class selector example.</p>
    </div>
    <hr>
    <h1>CSS Inheritance</h1>
    <div class="parent">
        <h2>Parent Element</h2>
        <p>This is the first child paragraph.</p>
        <p>This is the second child paragraph.</p>
        <span>This is a child span element.</span>
    </div>
    <hr>
    <h1>Important Rule</h1>
    <p class="example">CSS Important Rule Example</p>
</body>
</html>
