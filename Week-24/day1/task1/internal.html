<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS</title>
    <style>
        body {
            background-color: lightyellow;
        }
        h1 {
            color: red;
            text-align: center;
        }
        p {
            color: blue;
            font-size: 20px;
        }
        button {
            background-color: green;
            color: white;
            padding: 10px;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Welcome to CSS</h1>
    <p>This is an example of Internal CSS.</p>
    <button>Click Me</button>
</body>
</html>
