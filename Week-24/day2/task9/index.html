
<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Dashboard</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <h1>Admin Dashboard</h1>

    <div class="dashboard">

        <header class="header">
            <h2>Admin Panel</h2>
        </header>

        <aside class="sidebar">
            <h3>Menu</h3>
            <p>Dashboard</p>
            <p>Users</p>
            <p>Products</p>
            <p>Settings</p>
        </aside>

        <main class="main">
            <h2>Dashboard Overview</h2>

            <div class="cards">
                <div class="card">
                    <h3>Total Users</h3>
                    <p>1200</p>
                </div>

                <div class="card">
                    <h3>Total Products</h3>
                    <p>350</p>
                </div>

                <div class="card">
                    <h3>Total Sales</h3>
                    <p>850</p>
                </div>
            </div>
        </main>

        <section class="content">
            <h2>Recent Activities</h2>
            <p>New user registered.</p>
            <p>New product added.</p>
            <p>Order completed.</p>
        </section>

        <footer class="footer">
            <p>Copyright 2026 Admin Dashboard</p>
        </footer>

    </div>

</body>
</html>
