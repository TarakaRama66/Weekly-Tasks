<!DOCTYPE html>
<html>
<head>
    <title>CSS Display Properties</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <h1>CSS Display Properties</h1>

    <h2>1. Block Display</h2>
    <div class="block">Block 1</div>
    <div class="block">Block 2</div>

    <h2>2. Inline Display</h2>
    <span class="inline">Inline 1</span>
    <span class="inline">Inline 2</span>

    <h2>3. Inline-Block Display</h2>
    <div class="inline-block">Box 1</div>
    <div class="inline-block">Box 2</div>

    <h2>4. Flex Display</h2>
    <div class="flex-container">
        <div>Item 1</div>
        <div>Item 2</div>
        <div>Item 3</div>
    </div>

    <h2>5. Grid Display</h2>
    <div class="grid-container">
        <div>Grid 1</div>
        <div>Grid 2</div>
        <div>Grid 3</div>
    </div>

    <h2>6. None Display</h2>
    <div class="hidden">This element is hidden.</div>

</body>
</html>
