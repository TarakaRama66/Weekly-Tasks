<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Alignment and Wrapping</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <h1>Flexbox Properties</h1>

    <h2>1. Justify Content</h2>
    <div class="container justify">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
    </div>

    <h2>2. Align Items</h2>
    <div class="container align">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
    </div>

    <h2>3. Flex Direction</h2>
    <div class="container direction">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
    </div>

    <h2>4. Flex Wrap</h2>
    <div class="container wrap">
        <div>Box 1</div>
        <div>Box 2</div>
        <div>Box 3</div>
        <div>Box 4</div>
        <div>Box 5</div>
        <div>Box 6</div>
    </div>

    <h2>5. Gap and Spacing</h2>
    <div class="container gap">
        <div>HTML</div>
        <div>CSS</div>
        <div>JavaScript</div>
    </div>

</body>
</html>
