<!DOCTYPE html>
<html>
<head>
  <title>User Manager</title>
 
  <style>
    body{
      font-family: Arial;
      max-width: 600px;
      margin: 20px auto;
    }
 
    input{
      padding:10px;
      margin:5px;
    }
 
    button{
      padding:10px;
      cursor:pointer;
    }
 
    .user{
      border:1px solid #ddd;
      padding:10px;
      margin:10px 0;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
 
    .delete{
      background:red;
      color:white;
      border:none;
    }
  </style>
</head>
<body>
 
<h1>User Management App</h1>
 
<form id="userForm">
 
  <input
    type="text"
    id="name"
    placeholder="Enter Name"
    required
  >
 
  <input
    type="email"
    id="email"
    placeholder="Enter Email"
    required
  >
 
  <button type="submit">
    Add User
  </button>
 
</form>
 
<h3 id="status"></h3>
 
<div id="userContainer"></div>
 
<script src="./index.js"></script>
 
</body>
</html>
