<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block vs Inline</title>
</head>
<body>
    <h1>Block-Level Elements</h1>
    <div>HTML</div>
    <div>CSS</div>
    <div>JavaScript</div>
    <hr>
    <h1>Inline Elements</h1>
    <span>HTML</span>
    <span>CSS</span>
    <span>JavaScript</span>
</body>
</html>
