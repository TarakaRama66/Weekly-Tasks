<!DOCTYPE html>
<html>
<head>
    <title>Fieldset Example</title>
</head>
<body>
<form>
    <fieldset>
        <legend>Personal Information</legend>
        <label>Name</label>
        <input type="text">
        <br><br>
        <label>Email</label>
        <input type="email">
    </fieldset>
    <br>
    <fieldset>
        <legend>Professional Information</legend>
        <label>Employee ID</label>
        <input type="text">
        <br><br>
        <label>Department</label>
        <input type="text">
    </fieldset>
</form>
</body>
</html>
