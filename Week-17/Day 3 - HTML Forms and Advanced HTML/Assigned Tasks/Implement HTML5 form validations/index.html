<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Validation</title>
</head>
<body>
<h2>Registration Form</h2>
<form>
    <label>Name</label>
    <input
        type="text"
        required
        minlength="3"
        maxlength="30"
        placeholder="Enter Name">
    <br><br>
    <label>Email</label>
    <input
        type="email"
        required
        placeholder="Enter Email">
    <br><br>
    <label>Phone Number</label>
    <input
        type="text"
        pattern="[0-9]{10}"
        required
        placeholder="10 Digit Number">
    <br><br>
    <label>Age</label>
    <input
        type="number"
        min="18"
        max="60"
        required>
    <br><br>
    <label>Password</label>
    <input
        type="password"
        minlength="8"
        required>
    <br><br>
    <input type="submit">
</form>
</body>
</html>
