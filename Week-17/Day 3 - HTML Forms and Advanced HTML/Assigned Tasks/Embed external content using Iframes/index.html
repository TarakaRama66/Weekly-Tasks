<!DOCTYPE html>
<html>
<head>
    <title>Iframe Example</title>
</head>
<body>
 
<h1>Google Maps</h1>
 
<iframe 
  src="https://www.google.com/maps/embed?pb=YOUR_UNIQUE_EMBED_CODE"
  width="600" 
  height="450" 
  style="border:0;" 
  allowfullscreen="" 
  loading="lazy" 
  referrerpolicy="no-referrer-when-downgrade">
</iframe>
 
<br><br>
 
<h1>YouTube Video</h1>
 
<iframe width="560" height="315" src="https://www.youtube.com/embed/DMD2uthghWE?si=cRL093aiDlkSDxAN" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
 
</body>
</html>
