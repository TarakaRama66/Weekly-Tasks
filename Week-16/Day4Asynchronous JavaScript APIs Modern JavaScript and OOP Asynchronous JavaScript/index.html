<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced JavaScript Dashboard</title>
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <header>
        <h1>Advanced JavaScript Practice Dashboard</h1>
        <p>Frontend Training - All Assigned Tasks</p>
    </header>
    <main>
        <!-- Timers -->
        <section class="card">
            <h2>Timers & Execution Order</h2>
            <button id="timeoutBtn">setTimeout Demo</button>
            <button id="intervalBtn">setInterval Demo</button>
            <button id="stopIntervalBtn">Stop Interval</button>
            <button id="eventLoopBtn">Event Loop Demo</button>
        </section>
        <!-- Promises -->
        <section class="card">
            <h2>Promises</h2>
            <button id="promiseBtn">Create Promise</button>
            <button id="chainBtn">Promise Chaining</button>
            <button id="allBtn">Promise.all</button>
            <button id="allSettledBtn">Promise.allSettled</button>
            <button id="raceBtn">Promise.race</button>
            <button id="anyBtn">Promise.any</button>
        </section>
        <!-- Async Await -->
        <section class="card">
            <h2>Async Await & Error Handling</h2>
            <button id="asyncBtn">Async Await</button>
            <button id="tryCatchBtn">Try Catch</button>
        </section>
        <!-- API CRUD -->
        <section class="card">
            <h2>Fetch API CRUD</h2>
            <button id="getUsersBtn">GET Users</button>
            <button id="postUserBtn">POST User</button>
            <button id="putUserBtn">PUT User</button>
            <button id="patchUserBtn">PATCH User</button>
            <button id="deleteUserBtn">DELETE User</button>
        </section>
        <!-- Loading States -->
        <section class="card">
            <h2>Application States</h2>
            <button id="loadingBtn">Loading State</button>
            <button id="successBtn">Success State</button>
            <button id="emptyBtn">Empty State</button>
            <button id="errorBtn">Error State</button>
        </section>
        <!-- Map Set -->
        <section class="card">
            <h2>Map & Set</h2>
            <button id="mapBtn">Map Example</button>
            <button id="setBtn">Set Example</button>
        </section>
        <!-- Classes -->
        <section class="card">
            <h2>Classes & Objects</h2>
            <button id="classBtn">Employee Class</button>
            <button id="inheritanceBtn">Inheritance Example</button>
            <button id="prototypeBtn">Prototype Example</button>
        </section>
        <!-- Iterator -->
        <section class="card">
            <h2>Iterator & Generator</h2>
            <button id="iteratorBtn">Custom Iterator</button>
            <button id="generatorBtn">Generator Function</button>
        </section>
        <!-- Modern JS -->
        <section class="card">
            <h2>Modern JavaScript</h2>
            <button id="optionalBtn">Optional Chaining</button>
            <button id="nullishBtn">Nullish Coalescing</button>
            <button id="destructuringBtn">Destructuring</button>
            <button id="spreadBtn">Spread Operator</button>
            <button id="restBtn">Rest Parameters</button>
            <button id="templateBtn">Template Literals</button>
        </section>
        <!-- Output Section -->
        <section class="card output-card">
            <h2>Output</h2>
            <div id="status"></div>
            <div id="output">
                Click any button to see results...
            </div>
        </section>
    </main>
    <script src="./index.js"></script>
</body>
</html>
